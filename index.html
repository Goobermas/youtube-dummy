<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0813; color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 260px; background-color: #130f22; border-right: 2px solid #2d1f47; display: flex; flex-direction: column; }
        .header { padding: 20px; font-size: 20px; font-weight: bold; text-align: center; border-bottom: 2px solid #2d1f47; letter-spacing: 1px; color: #a855f7; }
        .channel-list { flex: 1; overflow-y: auto; list-style: none; }
        .channel-btn { width: 100%; padding: 15px 20px; background: none; border: none; color: #aaa; text-align: left; font-size: 16px; cursor: pointer; border-bottom: 1px solid #1c1630; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .channel-btn:hover { background-color: #1c1630; color: #fff; }
        .channel-btn.active { background-color: #2d1f47; color: #a855f7; font-weight: bold; border-left: 4px solid #a855f7; }
        .ch-num { font-size: 12px; color: #6b21a8; font-weight: bold; background: #2d1f47; padding: 2px 6px; border-radius: 4px; }
        .active .ch-num { background: #a855f7; color: #fff; }
        #player-container { flex: 1; background-color: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .controls { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; background: rgba(19, 15, 34, 0.8); padding: 10px; border-radius: 8px; border: 1px solid #2d1f47; backdrop-filter: blur(5px); }
        .nav-btn { background: #2d1f47; border: 1px solid #a855f7; color: white; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .nav-btn:hover { background: #a855f7; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">🏎️ CAR TV</div>
        <ul class="channel-list" id="channels"></ul>
    </div>

    <div id="player-container">
        <!-- Added native autoplay permissions -->
        <iframe 
            id="tv-player" 
            src="" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
        <div class="controls">
            <button class="nav-btn" onclick="changeChannel(-1)">CH -</button>
            <button class="nav-btn" onclick="changeChannel(1)">CH +</button>
        </div>
    </div>

    <script>
        // Curated channels using fresh, active, long-form video IDs
        const tvChannels = [
            { name: "BUM", videoId: "i-pC_9-OcoA" },
            { name: "DONUT", videoId: "G7m8eY2o6V4" },
            { name: "Banks Power", videoId: "J8aX5vP_q8E" },
            { name: "Westen Champlin", videoId: "bW_n6zR7F3A" },
            { name: "POWERNATION", videoId: "X2M3_k5F8wQ" }
        ];

        let currentChannelIndex = 0;

        function initSidebar() {
            const list = document.getElementById("channels");
            list.innerHTML = "";
            tvChannels.forEach((ch, idx) => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <button class="channel-btn ${idx === currentChannelIndex ? 'active' : ''}" onclick="selectChannel(${idx})">
                        <span>${ch.name}</span>
                        <span class="ch-num">CH ${idx + 1}</span>
                    </button>
                `;
                list.appendChild(li);
            });
        }

        function playChannel(index) {
    		currentChannelIndex = index;
    
    		var buttons = document.querySelectorAll(".channel-btn");
    		buttons.forEach(function(btn, idx) {
        		if(idx === index) btn.classList.add("active");
        		else btn.classList.remove("active");
    		});

    		var player = document.getElementById("tv-player");
    		var vId = tvChannels[index].videoId;
    
    		// Use standard quotes and a + sign to combine the video ID
    		player.src = "https://www.youtube-nocookie.com/embed/" + vId + "?autoplay=1&mute=1&modestbranding=1&rel=0&iv_load_policy=3";
	}

        function selectChannel(index) {
            playChannel(index);
        }

        function changeChannel(direction) {
            let newIndex = currentChannelIndex + direction;
            if (newIndex >= tvChannels.length) newIndex = 0;
            if (newIndex < 0) newIndex = tvChannels.length - 1;
            playChannel(newIndex);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') { e.preventDefault(); changeChannel(-1); }
            if (e.key === 'ArrowDown') { e.preventDefault(); changeChannel(1); }
        });

        initSidebar();
        
        // Start app after user interacts to satisfy modern browser audio policies
        window.addEventListener('click', () => {
            if(!document.getElementById("tv-player").src) {
                playChannel(currentChannelIndex);
            }
        }, { once: true });
        
        // Fallback immediate launch
        playChannel(currentChannelIndex);
    </script>
</body>
</html>
