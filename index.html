<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curated Car Video Picker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0813; color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 280px; background-color: #130f22; border-right: 2px solid #2d1f47; display: flex; flex-direction: column; }
        .header { padding: 20px; font-size: 18px; font-weight: bold; text-align: center; border-bottom: 2px solid #2d1f47; letter-spacing: 1px; color: #a855f7; }
        .creator-list { padding: 10px; list-style: none; display: flex; flex-direction: column; gap: 8px; border-bottom: 2px solid #2d1f47;}
        .creator-btn { width: 100%; padding: 12px 15px; background: #1c1630; border: 1px solid #2d1f47; color: #aaa; text-align: left; font-size: 14px; cursor: pointer; border-radius: 6px; transition: all 0.2s; font-weight: bold; }
        .creator-btn:hover { background-color: #2d1f47; color: #fff; }
        .creator-btn.active { background-color: #a855f7; color: #fff; border-color: #c084fc; }

        #feed-container { width: 340px; background-color: #161229; border-right: 2px solid #2d1f47; display: flex; flex-direction: column; }
        .feed-header { padding: 15px; font-size: 14px; font-weight: bold; text-transform: uppercase; color: #a855f7; border-bottom: 1px solid #2d1f47; background: #130f22; }
        .video-feed { flex: 1; overflow-y: auto; list-style: none; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .video-item { background: #1c1630; border: 1px solid #2d1f47; padding: 10px; border-radius: 6px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; gap: 6px; }
        .video-item:hover { border-color: #a855f7; background: #2d1f47; }
        .video-item.active { border-color: #a855f7; background: #2d1f47; box-shadow: 0 0 10px rgba(168, 85, 247, 0.2); }
        .video-thumb { width: 100%; aspect-ratio: 16/9; background-size: cover; background-position: center; border-radius: 4px; background-color: #000; }
        .video-title { font-size: 13px; font-weight: bold; line-height: 1.4; color: #fff; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .video-date { font-size: 11px; color: #7c3aed; font-weight: bold; }

        #player-container { flex: 1; background-color: #000; display: flex; justify-content: center; align-items: center; }
        #tv-player { width: 100%; height: 100%; border: none; }
        .no-video-msg { color: #554f73; font-size: 14px; font-weight: bold; text-align: center; padding: 20px; }
        .loading-spinner { text-align: center; padding: 20px; color: #a855f7; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">📋 CREATORS</div>
        <ul class="creator-list" id="creators"></ul>
    </div>

    <div id="feed-container">
        <div class="feed-header" id="feed-title">Recent Uploads</div>
        <ul class="video-feed" id="video-feed">
            <div class="no-video-msg">Select a channel to fetch updates.</div>
        </ul>
    </div>

    <div id="player-container">
        <iframe id="tv-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        const creators = [
            { name: "BUM", channelId: "UC9uSg7S86t6P_iSg8V7DcbA" },          
            { name: "DONUT", channelId: "UC6Jxa_K73MMwZ6M9wXwK2mw" },        
            { name: "Banks Power", channelId: "UCH9p97gXgP-eX_Z_oV_h81g" },  
            { name: "Westen Champlin", channelId: "UUmEunD7Z_p_nU9fGxFep3vQ" }, 
            { name: "POWERNATION", channelId: "UUk7I7p8WByV6vK69SgG1_9A" }   
        ];

        let selectedCreatorIndex = 0;

        function initApp() {
            const list = document.getElementById("creators");
            list.innerHTML = "";
            creators.forEach((creator, idx) => {
                const li = document.createElement("li");
                li.innerHTML = '<button class="creator-btn ' + (idx === selectedCreatorIndex ? 'active' : '') + '" onclick="selectCreator(' + idx + ')">' + creator.name + '</button>';
                list.appendChild(li);
            });
            fetchRSSFeed(selectedCreatorIndex);
        }

        function selectCreator(index) {
            selectedCreatorIndex = index;
            document.querySelectorAll(".creator-btn").forEach((btn, idx) => {
                if(idx === index) btn.classList.add("active");
                else btn.classList.remove("active");
            });
            fetchRSSFeed(index);
        }

        function fetchRSSFeed(index) {
            const channelId = creators[index].channelId;
            const targetFeed = "https://youtube.com" + channelId;
            
            // Cleaned up, working open-source proxy URL builder format
            const proxyUrl = "https://allorigins.win" + encodeURIComponent(targetFeed);
            
            const feedContainer = document.getElementById("video-feed");
            document.getElementById("feed-title").innerText = creators[index].name + " Feed";
            feedContainer.innerHTML = '<div class="loading-spinner">Fetching RSS Feed Stream...</div>';

            fetch(proxyUrl)
                .then(function(response) {
                    if (response.ok) return response.json();
                    throw new Error('Proxy validation failed.');
                })
                .then(function(data) {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                    const entries = xmlDoc.getElementsByTagName("entry");

                    if (entries.length === 0) {
                        feedContainer.innerHTML = '<div class="no-video-msg">No recent videos found.</div>';
                        return;
                    }

                    feedContainer.innerHTML = "";
                    
                    // Fixed namespace array targeting to read the video metadata values accurately
                    for (let i = 0; i < entries.length; i++) {
                        const entry = entries[i];
                        
                        const titleEl = entry.getElementsByTagName("title")[0];
                        const title = titleEl ? titleEl.textContent : "Untitled Video";
                        
                        // Strict namespace parser for yt:videoId tags
                        const videoIdEl = entry.getElementsByTagNameNS("http://youtube.com", "videoId")[0];
                        const videoId = videoIdEl ? videoIdEl.textContent : null;

                        if (!videoId) continue;

                        const pubEl = entry.getElementsByTagName("published")[0];
                        const pubDateRaw = pubEl ? pubEl.textContent : "";
                        let cleanDate = "Unknown Date";
                        if (pubDateRaw) {
                            const dateObj = new Date(pubDateRaw);
                            cleanDate = dateObj.toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'});
                        }

                        const thumbnail = "https://youtube.com" + videoId + "/mqdefault.jpg";

                        const li = document.createElement("li");
                        li.className = "video-item";
                        li.setAttribute("id", "vid-" + videoId);
                        
                        // Explicit string enclosure for single video selection variables
                        li.onclick = (function(vId) {
                            return function() { loadVideo(vId); };
                        })(videoId);

                        li.innerHTML = `
                            <div class="video-thumb" style="background-image: url('${thumbnail}');"></div>
                            <div class="video-title">${title}</div>
                            <div class="video-date">📅 ${cleanDate}</div>
                        `;
                        feedContainer.appendChild(li);
                    }

                    // Auto-load the most recent video item found at index zero
                    const initialIdEl = entries[0].getElementsByTagNameNS("http://youtube.com", "videoId")[0];
                    if (initialIdEl) {
                        loadVideo(initialIdEl.textContent);
                    }
                })
                .catch(function(error) {
                    console.error(error);
                    feedContainer.innerHTML = '<div class="no-video-msg">Could not load the feed loop. Please refresh.</div>';
                });
        }

        function loadVideo(videoId) {
            document.querySelectorAll(".video-item").forEach(item => item.classList.remove("active"));
            
            const itemElement = document.getElementById("vid-" + videoId);
            if (itemElement) itemElement.classList.add("active");

            const player = document.getElementById("tv-player");
            player.src = "https://youtube.com" + videoId + "?autoplay=1&modestbranding=1&rel=0";
        }

        initApp();
    </script>
</body>
</html>
