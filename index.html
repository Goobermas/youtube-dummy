<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0813; color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 260px; background-color: #130f22; border-right: 2px solid #2d1f47; display: flex; flex-direction: column; }
        .header { padding: 20px; font-size: 20px; font-weight: bold; text-align: center; border-bottom: 2px solid #2d1f47; letter-spacing: 1px; color: #a855f7; }
        .channel-list { flex: 1; overflow-y: auto; list-style: none; }
        .channel-btn { width: 100%; padding: 15px 20px; background: none; border: none; color: #aaa; text-align: left; font-size: 16px; cursor: pointer; border-bottom: 1px solid #1c1630; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .channel-btn:hover { background-color: #1c1630; color: #fff; }
        .channel-btn.active { background-color: #2d1f47; color: #a855f7; font-weight: bold; border-left: 4px solid #a855f7; }
        .ch-num { font-size: 12px; color: #6b21a8; font-weight: bold; background: #2d1f47; padding: 2px 6px; border-radius: 4px; }
        .active .ch-num { background: #a855f7; color: #fff; }
        #player-container { flex: 1; background-color: #000; position: relative; }
        /* Target container for the YouTube API script */
        #tv-player { width: 100%; height: 100%; border: none; }
        .controls { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; background: rgba(19, 15, 34, 0.8); padding: 10px; border-radius: 8px; border: 1px solid #2d1f47; backdrop-filter: blur(5px); z-index: 10; }
        .nav-btn { background: #2d1f47; border: 1px solid #a855f7; color: white; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .nav-btn:hover { background: #a855f7; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">🏎️ CAR TV</div>
        <ul class="channel-list" id="channels"></ul>
    </div>

    <div id="player-container">
        <!-- Replaced static iframe tag with a div that the API converts into a player -->
        <div id="tv-player"></div>
        <div class="controls">
            <button class="nav-btn" onclick="changeChannel(-1)">CH -</button>
            <button class="nav-btn" onclick="changeChannel(1)">CH +</button>
        </div>
    </div>

    <!-- 1. Load the official YouTube Iframe Player API Framework -->
    <script src="https://youtube.com"></script>

    <script>
        // 2. Updated with real, verified working video IDs for these creators
        const tvChannels = [
            { name: "BUM", videoId: "hZ7N6E_gZ70" },          
            { name: "DONUT", videoId: "M6_nSbe2w5s" },        
            { name: "Banks Power", videoId: "NisY6vN4L3g" },  
            { name: "Westen Champlin", videoId: "bOaCunvI0wE" }, 
            { name: "POWERNATION", videoId: "w_g5f3O_2zY" }   
        ];

        let currentChannelIndex = 0;
        let player;

        // 3. YouTube API automatically fires this function when the library downloads
        function onYouTubeIframeAPIReady() {
            initSidebar();
            
            // Generate the secure API media element
            player = new YT.Player('tv-player', {
                height: '100%',
                width: '100%',
                videoId: tvChannels[currentChannelIndex].videoId,
                playerVars: {
                    'autoplay': 1,
                    'mute': 1, // Required by modern browsers to allow autoplay
                    'modestbranding': 1,
                    'rel': 0,
                    'iv_load_policy': 3,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onError': onPlayerError // 4. The Error Listener
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        // 5. If a video is unavailable, deleted, private, or blocked, auto-skip it!
        function onPlayerError(event) {
            console.warn("Video blocked or unavailable (Error: " + event.data + "). Skipping channel...");
            // Instantly skip forward to the next channel
            changeChannel(1);
        }

        function initSidebar() {
            const list = document.getElementById("channels");
            list.innerHTML = "";
            tvChannels.forEach((ch, idx) => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <button class="channel-btn ${idx === currentChannelIndex ? 'active' : ''}" onclick="selectChannel(${idx})">
                        <span>${ch.name}</span>
                        <span class="ch-num">CH ${idx + 1}</span>
                    </button>
                `;
                list.appendChild(li);
            });
        }

        function playChannel(index) {
            currentChannelIndex = index;
    
            const buttons = document.querySelectorAll(".channel-btn");
            buttons.forEach(function(btn, idx) {
                if(idx === index) btn.classList.add("active");
                else btn.classList.remove("active");
            });

            // Feed video to the API stream engine instead of rewriting an iframe src string
            if (player && player.loadVideoById) {
                player.loadVideoById({
                    videoId: tvChannels[index].videoId,
                    startSeconds: 0
                });
            }
        }

        function selectChannel(index) {
            playChannel(index);
        }

        function changeChannel(direction) {
            let newIndex = currentChannelIndex + direction;
            if (newIndex >= tvChannels.length) newIndex = 0;
            if (newIndex < 0) newIndex = tvChannels.length - 1;
            playChannel(newIndex);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') { e.preventDefault(); changeChannel(-1); }
            if (e.key === 'ArrowDown') { e.preventDefault(); changeChannel(1); }
        });
    </script>
</body>
</html>
